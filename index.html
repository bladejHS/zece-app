const RUN_KINDS=['ez','thr','lng','int','tmp'];
function runLab(){
  const R=rangeOf(S.rng||'m'), Pv=prevRange(R), B=bucketsOf(R), inR=r=>r.date>=R.a&&r.date<=R.b;
  const all=(S.runs||[]).map((r,i)=>Object.assign({i},r)), rs=all.filter(inR).sort((a,b)=>a.date<b.date?-1:1), ps=Pv?all.filter(r=>r.date>=Pv.a&&r.date<=Pv.b):[];
  const km=sumKm(rs), mn=rs.reduce((a,r)=>a+(+r.min||0),0), pkm=sumKm(ps), pmn=ps.reduce((a,r)=>a+(+r.min||0),0);
  const pace=km>0&&mn>0?mn/km:null, ppace=pkm>0&&pmn>0?pmn/pkm:null, hrR=rs.filter(r=>+r.hr>0), long=rs.reduce((a,r)=>!a||+r.km>+a.km?r:a,null);
  const best=rs.filter(r=>+r.km>=1&&paceOf(r)).reduce((a,r)=>!a||paceOf(r)<paceOf(a)?r:a,null);
  const c=(x,y)=>Pv&&y>0?pctCh(x,y):null;
  const kmB=B.list.map(b=>({lbl:b.lbl,tip:b.tip,v:Math.round(sumKm(all.filter(r=>r.date>=b.a&&r.date<=b.b))*10)/10,hi:true}));
  const pp=rs.filter(r=>+r.km>=1&&paceOf(r));
  const byK=RUN_KINDS.map(k=>({k,n:rs.filter(r=>r.kind===k).length,km:sumKm(rs.filter(r=>r.kind===k))})).filter(x=>x.n), mk=Math.max(1,...byK.map(x=>x.km));
  const Z=hrZones(), zc=[0,0,0,0,0]; hrR.forEach(r=>{ const z=hrZone(+r.hr); if(z>=0) zc[z]++; }); const zm=Math.max(1,...zc);
  /* consecvența ritmului la alergările ușoare: abaterea standard în secunde/km */
  const ez=pp.filter(r=>r.kind==='ez'||r.kind==='lng'), ezsd=ez.length>=3?Math.sqrt(avgOf(ez.map(r=>Math.pow(paceOf(r)*60-avgOf(ez.map(q=>paceOf(q)*60)),2)))):null;
  return `${rangeBar()}
    <div class="card wide"><div class="kpis c4">${kv('Distanță',num(km,1),'km',c(km,pkm))}${kv('Timp',mn?fmtClock(mn*60):'0:00','',c(mn,pmn))}
      ${kv('Alergări',rs.length,'',c(rs.length,ps.length))}${kv('Ritm mediu',pace?mmss(pace):'—',pace?'/km':'',pace&&ppace?pctCh(pace,ppace):null,{low:true})}
      ${kv('Viteză medie',pace?num(60/pace,1):'—',pace?'km/h':'',null,{s:'distanță / timp'})}${kv('Cea mai lungă',long?num(long.km,1):'—',long?'km':'',null,{s:long?fmtDay(long.date):'&nbsp;',a:long?`data-a="runOpen" data-i="${long.i}"`:''})}
      ${kv('Cel mai bun ritm',best?mmss(paceOf(best)):'—',best?'/km':'',null,{s:best?num(best.km,1)+' km · '+fmtDay(best.date):'alergări ≥ 1 km',a:best?`data-a="runOpen" data-i="${best.i}"`:''})}
      ${kv('Puls mediu',hrR.length?Math.round(avgOf(hrR.map(r=>+r.hr))):'—',hrR.length?'bpm':'',null,{s:hrR.length?hrR.length+' din '+rs.length+' alergări au puls':'nicio alergare cu puls'})}</div></div>
    ${rs.length?`<div class="card"><div class="card-h"><div class="eyebrow">${ic('run')} Kilometri ${B.kind==='day'?'pe zi':B.kind==='week'?'pe săptămână':'pe lună'}</div></div>
      ${barChart(kmB,{dec:1,unit:'km',label:'kilometri'})}${chStats(kmB.map(x=>x.v),{fmt:v=>num(v,1)+' km',cur:km,prev:pkm>0?pkm:null})}</div>
    ${pp.length>=2?`<div class="card"><div class="card-h"><div class="eyebrow">${ic('gauge')} Ritmul fiecărei alergări</div><span class="xs mu">sus = mai rapid</span></div>
      ${lineChart({pts:pp.map(r=>({x:r.date,y:paceOf(r),note:(RUNK[r.kind]||'')+' · '+num(r.km,1)+' km'})),inv:true,dots:true,trend:pp.length>=4,noArea:true,hex:COL().run,blue:true,fmt:v=>mmss(v)+' /km',fmtAx:v=>mmss(v),label:'ritmul alergărilor',minR:.3})}
      ${chStats(pp.map(r=>paceOf(r)),{fmt:v=>mmss(v)+' /km',lowGood:true})}
      ${ezsd!=null?`<div class="note">Alergările ușoare și lungi au o variație a ritmului de <b>±${Math.round(ezsd)} s/km</b>${ezsd<=15?': foarte constant.':ezsd<=30?'.':': ritmul la easy variază mult; verifică pulsul, nu ceasul.'}</div>`:''}</div>`:''}
    <div class="card"><div class="card-h"><div class="eyebrow">${ic('layers')} Tipuri de alergare</div></div>
      <div class="dist">${byK.map(x=>`<div class="dist-r"><span>${esc(RUNK[x.k])}</span><div class="b run"><i style="width:${(x.km/mk*100).toFixed(1)}%"></i></div><span>${num(x.km,1)} km</span></div>`).join('')}</div>
      <div class="xs mu2" style="margin-top:8px">${byK.map(x=>x.n+' × '+RUNK[x.k].toLowerCase()).join(' · ')}</div></div>
    <div class="card"><div class="card-h"><div class="eyebrow">${ic('heart')} Alergări după zona pulsului mediu</div></div>
      ${hrR.length?`<div class="dist">${Z.z.map((z,i)=>`<div class="dist-r"><span style="color:${HRZC()[i]}">Z${z.n} · ${z.lo}–${z.hi}</span><div class="b"><i style="width:${(zc[i]/zm*100).toFixed(1)}%;background:${HRZC()[i]}"></i></div><span>${zc[i]}</span></div>`).join('')}</div>
        <div class="note">Fiecare alergare intră în zona pulsului ei <b>mediu</b>; nu e timpul petrecut în fiecare zonă (acela apare doar la sesiunile cu senzorul conectat).</div>`
        :`<div class="empty sm">Nicio alergare cu puls în perioadă. Pulsul vine din Strava (cu ceasul) sau îl scrii când notezi alergarea.</div>`}</div>`
    :`<div class="card"><div class="empty">${ic('run')}<div>Nicio alergare în ${esc(R.lbl)}.</div></div></div>`}
    ${runListCard(rs.slice().reverse())}
    ${aeroCard()}${zonesCard()}${shoesCard()}${runFormCard()}`;
}
/* lista alergărilor din perioadă: atingi una pentru detalii, bifezi două pentru comparație */
function runListCard(rs){

/* timpii pe km, scriși de mână: „5:10 5:02, 4:58" → despărțiri de 1000 m (ultima poate fi parțială) */

function rcmpHTML(){

    ['Distanță',num(A.km,2)+' km',num(B.km,2)+' km',[+A.km,+B.km,'km',2,false]],['Timp',fmtClock(A.min*60),fmtClock(B.min*60),[A.min*60,B.min*60,'t',0,true]],
    ['Ritm',fmtPace(pA),fmtPace(pB),pA&&pB?[pA*60,pB*60,'p',0,true]:null],['Viteză',fmtKmh(kmh(A)),fmtKmh(kmh(B)),kmh(A)&&kmh(B)?[kmh(A),kmh(B),'km/h',1,false]:null],
    ['Puls mediu',A.hr?A.hr+' bpm':'—',B.hr?B.hr+' bpm':'—',A.hr&&B.hr?[+A.hr,+B.hr,'bpm',0,true]:null],
    ['Eficiență (m/bătaie)',A.hr&&pA?num(1000/pA/A.hr,2):'—',B.hr&&pB?num(1000/pB/B.hr,2):'—',A.hr&&pA&&B.hr&&pB?[1000/pA/A.hr,1000/pB/B.hr,'',2,false]:null],
    ['Cadență',A.cad?A.cad+' pași/min':'—',B.cad?B.cad+' pași/min':'—',A.cad&&B.cad?[+A.cad,+B.cad,'pași/min',0,false]:null],['Elevație',A.elev!=null?Math.round(A.elev)+' m':'—',B.elev!=null?Math.round(B.elev)+' m':'—',null],
    ['Cel mai rapid km',fastestKm(A)?fmtClock(fastestKm(A).t):'—',fastestKm(B)?fmtClock(fastestKm(B).t):'—',fastestKm(A)&&fastestKm(B)?[fastestKm(A).t,fastestKm(B).t,'t',0,true]:null]];
  const dl=d=>{ if(!d) return ''; const [a,b,u,dc,low]=d, x=b-a; if(Math.abs(x)<1e-9) return '<span class="mu2">la fel</span>';

  const sa=runSplits(A), sb=runSplits(B);

    <div class="cmp2 c3"><div class="cmp2-h"><span></span><span>A</span><span>B</span><span>Diferență</span></div>
      ${rows.map(([l,a,b,d])=>`<div class="cmp2-r"><span>${l}</span><span>${esc(a)}</span><span>${esc(b)}</span><span>${dl(d)}</span></div>`).join('')}</div>
    ${sa.length>=2&&sb.length>=2?`<div class="dsec"><h4>Ritm pe km</h4>${lineChart({pts:sa.map((s,i)=>({x:i+1,y:s.t*1000/s.d/60})),s2:[{pts:sb.map((s,i)=>({x:i+1,y:s.t*1000/s.d/60})),hex:'var(--mu)',name:'B',dash:1}],name:'A',num:true,xfmt:x=>'km '+x,inv:true,noArea:true,hex:COL().run,blue:true,fmt:v=>mmss(v)+' /km',fmtAx:v=>mmss(v),label:'ritm pe km A vs B',minR:.2,h:150})}
      <div class="ch-leg"><span><i style="background:${COL().run}"></i>A · ${fmtDay(A.date)}</span><span><i style="background:var(--mu)"></i>B · ${fmtDay(B.date)}</span></div></div>`
      :`<div class="note">Graficul pe km apare când ambele alergări au despărțiri (din Strava sau scrise de tine).</div>`}
    <div class="note">Verde = B mai bun decât A (mai rapid, mai lung, puls mai mic la același efort). Diferențele de traseu, vreme și oboseală nu apar în cifre.</div>

function k1Frac(g,cur){ if(!g||cur==null) return 0; const from=g.from!=null?g.from:(k1Results()[0]||{}).sec; if(from==null||from<=g.t) return cur<=g.t?1:0; return clamp((from-cur)/(from-g.t),0,1); }

      <div><span>Țintă</span><b>${tgt?fmtClock(tgt):'—'}</b><em>${g&&g.by?'până la '+fmtDay(g.by):g?'fără termen':'&nbsp;'}</em></div>

        <b class="k1-me" style="left:${(ghost/10).toFixed(1)}%"><span>tu · ${Math.round(ghost)} m</span></b><b class="k1-tg" style="left:100%"><span>ținta</span></b></div>
      <div class="xs mu" style="margin-top:28px">${ghost>=999?'Ai atins ținta: la ritmul tău treci linia odată cu ea sau înaintea ei.':`Când ținta trece linia de 1000 m, tu, la ritmul de acum (${fmtClock(cur)}, constant), ai fi la <b class="tx">${Math.round(ghost)} m</b>: îți lipsesc <b class="tx">${Math.round(1000-ghost)} m</b>.`}</div></div>`:''}</div>
  ${tgt?`<div class="card"><div class="card-h"><div class="eyebrow">${ic('flag')} Timpii de trecere</div><span class="xs mu">ritm constant</span></div>
      <div class="cmp2 ${cur?'c3':'c2'}"><div class="cmp2-h"><span>Distanța</span><span>Ținta</span>${cur?`<span>Acum</span><span>Diferență</span>`:''}</div>
        ${K1_MARKS.map(m=>{ const t=tgt*m/1000, c=cur?cur*m/1000:null; return `<div class="cmp2-r"><span>${m} m</span><span><b>${fmtSecD(t)}</b></span>${c!=null?`<span>${fmtSecD(c)}</span><span class="${c<=t?'good':'bad'}">${c<=t?'−':'+'}${num(Math.abs(c-t),1)} s</span>`:''}</div>`; }).join('')}</div>

}
const fmtSecD=s=>s<60?num(s,1)+' s':fmtClock(Math.round(s));
/* sesiunile-cheie: repetări scurte la ritmul țintei, cu pauză completă */
function k1Sessions(t){ const r100=t/10, r200=t/5, r400=t*.4;
  return [{t:'10 × 100 m în '+fmtSecD(r100),d:'pauză 45 s mers · ritmul țintei, relaxat',n:10,w:r100,r:45,l:'100 m'},
    {t:'6 × 200 m în '+fmtSecD(r200),d:'pauză 90 s · ritmul țintei',n:6,w:r200,r:90,l:'200 m'},
    {t:'4 × 400 m în '+fmtSecD(r400+2),d:'pauză 2 min · cu 2 s pe tură peste ritmul țintei',n:4,w:r400+2,r:120,l:'400 m'}]; }
ACT.k1Set=async()=>{ const t=parseTime(($('#k1T')||{}).value); if(!t||t<120||t>900){ shake('#k1T'); return; }
  const old=k1Goal(), b=k1Best(), g=old?Object.assign({},old,{t}):{id:'g'+Date.now().toString(36),k:'k1',t,d0:todayKey(),by:null,from:b?b.sec:null};
  await save('goals',(S.goals||[]).filter(x=>x.k!=='k1').concat([g])); render(); toast('Ținta pe 1 km',fmtClock(t)+' · ritm '+mmss(t/60)+' /km','info'); };
ACT.k1Add=async()=>{ const t=parseTime(($('#k1R')||{}).value), d=($('#k1D')||{}).value||todayKey(); if(!t||t<120||t>1200){ shake('#k1R'); return; }
  const before=k1Best(); await save('ptests',(S.ptests||[]).concat([{type:'k1',value:t,date:d>todayKey()?todayKey():d}]));
  const g=k1Goal(); if(g&&g.from==null){ await save('goals',(S.goals||[]).map(x=>x===g?Object.assign({},x,{from:t}):x)); }
  render(); if(before&&t<before.sec) prMoment({t:'Record pe 1 km',v:fmtClock(t),p:fmtClock(before.sec)}); else toast('Rezultat salvat','1 km în '+fmtClock(t),'info'); };
ACT.k1Del=async(el,{k,I})=>{ const i=(S.ptests||[]).findIndex(x=>x.type==='k1'&&x.date===k&&+x.value===I); if(i<0) return; const old=S.ptests[i];
  await save('ptests',S.ptests.filter((_,j)=>j!==i)); render(); toast('Rezultat șters',fmtClock(I),'info',{l:'Anulează',f:async()=>{ await save('ptests',(S.ptests||[]).concat([old])); render(); }}); };
ACT.k1Cue=(el,{I})=>{ S.k1Cue=I; render(); };
/* pacerul: cronometrul de intervale, cu un reper la fiecare 100/200/400 m pe ritmul țintei */
ACT.k1Pace=()=>{ const g=k1Goal(), t=g?g.t:null; if(!t) return; const cue=S.k1Cue||200, n=1000/cue, d=t*cue/1000, ph=[{k:'prep',d:10,l:'Pregătește-te',s:'Start la semnal · '+n+' repere de '+cue+' m'}];
  for(let i=1;i<=n;i++) ph.push({k:'work',d,l:(i*cue)+' m',s:i<n?'trebuie să fii la '+(i*cue)+' m în '+fmtSecD(d*i):'linia de sosire: '+fmtClock(t)});
  tmOpen({title:'Pacer 1 km · '+fmtClock(t),kind:'pacer',k1:t,ph}); };
ACT.k1Ses=(el,{I})=>{ const g=k1Goal(); if(!g) return; const s=k1Sessions(g.t)[I]; if(!s) return; const ph=[{k:'prep',d:10,l:'Pregătește-te',s:'Prima: '+s.l+' în '+fmtSecD(s.w)}];
  for(let i=1;i<=s.n;i++){ ph.push({k:'work',d:Math.round(s.w),l:s.l+' · '+i+'/'+s.n,s:'în '+fmtSecD(s.w)}); if(i<s.n) ph.push({k:'rest',d:s.r,l:'Pauză',s:'Urmează '+s.l+' '+(i+1)+'/'+s.n}); }
  tmOpen({title:s.t,kind:'k1ses',ph}); };
/* momentul unui record: o carte discretă care se închide singură (doar pentru recorduri care contează) */
function prMoment(o){
  const r=$('#ovRoot'); if(!r||r.firstChild) { toast(o.t,o.v+(o.p?' (înainte '+o.p+')':''),''); return; }
  r.innerHTML=`<div class="celeb" data-a="celebX"><div class="celeb-c pr-m"><div class="rays"><div class="core">${ic('trophy')}</div></div>
    <div class="eyebrow" style="justify-content:center">${esc(o.t)}</div><div class="pr-v">${esc(o.v)}</div>${o.p?`<div class="sm mu">înainte: ${esc(o.p)}</div>`:''}${o.s?`<div class="xs mu2" style="margin-top:6px">${esc(o.s)}</div>`:''}</div></div>`;
  buzz([60,40,60,40,120]); beep(990,.08); setTimeout(()=>beep(1320,.12),110); say('Record nou!');

const NOTIF_K={pr:['Recorduri noi','trophy'],goal:['Repere de obiective','target'],ach:['Realizări','award'],bk:['Memento pentru copie','shield'],sess:['Antrenament neterminat','clock']};

function notifGen(){
  const cfg=notifCfg(), tk=todayKey(), have=new Set((S.notif||[]).map(n=>n.id)), add=[];
  const push=(id,k,t,b,link)=>{ if(have.has(id)||!cfg[k]) return; have.add(id); add.push({id,k,t,b,link,at:new Date().toISOString(),d:tk}); };
  prBook().ev.filter(p=>p.d>=dayShift(tk,-1)&&p.cat!=='rep').forEach(p=>push('pr:'+p.key+':'+p.d,'pr','Record nou · '+prName(p),prVal(p)+(p.prev!=null?' (înainte '+(p.cat==='pace'?mmss(p.prev):p.cat==='time'?fmtClock(p.prev):num(p.prev,1))+')':''),'prog|pr'));
  goalsAll().forEach(g=>goalState(g).ms.forEach(m=>{ if(m.d>=dayShift(tk,-1)) push('goal:'+g.id+':'+m.m,'goal',m.m===1?'Obiectiv atins':'Reper atins · '+m.m*100+'%',goalTitle(g),'goal|'+g.id); }));
  achAll().forEach(x=>{ if(x.done&&x.date>=dayShift(tk,-1)) push('ach:'+x.id,'ach','Realizare · '+x.t,x.d,'prog|pr'); });
  if(bkCard()) push('bk:'+mondayOf(tk),'bk','Fă o copie a datelor','Totul stă doar în acest browser. Setări → Datele tale.','set|');

  return add;
}
let NOTIF_BUSY=false;
async function notifTick(){
  if(NOTIF_BUSY||!S.loaded) return; NOTIF_BUSY=true;
  try{
    /* realizările: prima rulare le înregistrează în liniște; după aceea, o realizare nouă = un toast discret */
    const A=achAll().filter(x=>x.done), seen=S.ach;
    if(!seen) await save('ach',Object.fromEntries(A.map(x=>[x.id,x.date])));
    else { const nw=A.filter(x=>!seen[x.id]); if(nw.length){ await save('ach',Object.assign({},seen,Object.fromEntries(nw.map(x=>[x.id,x.date||todayKey()]))));
      toast('Realizare deblocată',nw.map(x=>x.t).join(' · '),'info'); } }
    const add=notifGen(); if(add.length){ const first=!Array.isArray(S.notif);
      /* prima rulare după actualizare: ce exista deja intră ca citit, fără să sune */
      if(first) add.forEach(n=>n.r=true);
      await save('notif',(S.notif||[]).concat(add).slice(-120));
      if(!first){ const cfg=notifCfg(); add.forEach(n=>{ if(cfg.sys&&'Notification' in window&&Notification.permission==='granted'&&document.hidden) try{ new Notification(n.t,{body:n.b,tag:n.id,icon:'icon-192.png'}); }catch(e){} });
        renderTop(); renderSide(); } }
    else if(!Array.isArray(S.notif)) await save('notif',[]);
  }catch(e){ errLog(e&&e.message,'notif'); }
  NOTIF_BUSY=false;
}

const MUSC_RO={piept:'Piept',spate:'Spate',umeri:'Umeri',biceps:'Biceps',triceps:'Triceps',cvadriceps:'Cvadriceps',femurali:'Femurali',fesieri:'Fesieri',gambe:'Gambe',abdomen:'Abdomen',oblici:'Oblici',trapez:'Trapez','corp întreg':'Corp întreg'};
const fold=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
let EXC=null;
function exDb(){
  if(EXC&&EXC.v===S.exCustom) return EXC.m; const m={};
  EXDB_RAW.forEach(([n,ro,g,pm,mm,eq,lvl,c,x,vr,alt])=>{ const G=GUIDE[n]; m[n]={n,ro,g,pm,mm:mm||{},eq,lvl,c:c||(G&&G.c)||[],x:x||(G&&G.x)||[],s:G&&G.s||'',var:vr||[],alt:alt||SWAPS[n]||[],plan:!!G}; });
  (S.exCustom||[]).forEach(e=>{ if(e&&e.n&&!m[e.n]) m[e.n]={n:e.n,ro:e.ro||'',g:e.g||'Corp întreg',pm:e.pm||'',mm:e.pm&&MUSC.some(([k])=>k===e.pm)?{[e.pm]:1}:{},eq:e.eq||'',lvl:+e.lvl||1,c:e.c?[e.c]:[],x:[],s:'',var:[],alt:[],custom:true}; });
  /* harta mușchilor (seriile pe grupe) cunoaște acum și exercițiile din catalog și pe cele proprii */
  Object.keys(m).forEach(n=>{ const mm=m[n].mm, ok=Object.keys(mm).filter(k=>MUSC.some(([q])=>q===k)); if(ok.length&&!EXM[n]){ const o={}; ok.forEach(k=>o[k]=mm[k]); EXM[n]=o; } });
  EXC={v:S.exCustom,m}; return m;
}
const exInfo=n=>exDb()[n]||{n,ro:'',g:'',pm:'',mm:EXM[n]||{},eq:'',lvl:0,c:[],x:[],s:'',var:[],alt:SWAPS[n]||[],unknown:true};
const exAllNames=()=>[...new Set(Object.keys(exDb()).concat(Object.keys(S.lifts||{})))].sort((a,b)=>a.localeCompare(b));
const exLast=n=>{ const h=liftHist(n); return h.length?h[h.length-1].d:null; };
const exFav=n=>(S.exFav||[]).indexOf(n)>=0;
function exSearch(q,f){
  const t=fold(q).split(/\s+/).filter(Boolean), db=exDb();
  let L=exAllNames().map(n=>db[n]||exInfo(n));
  if(f.g&&f.g!=='all') L=L.filter(e=>e.g===f.g);
  if(f.eq) L=L.filter(e=>e.eq===f.eq);
  if(f.lvl) L=L.filter(e=>e.lvl===f.lvl);
  if(f.only==='fav') L=L.filter(e=>exFav(e.n)); else if(f.only==='recent') L=L.filter(e=>exLast(e.n)).sort((a,b)=>exLast(a.n)<exLast(b.n)?1:-1); else if(f.only==='mine') L=L.filter(e=>e.custom);
  if(t.length) L=L.filter(e=>{ const hay=fold([e.n,e.ro,e.g,e.pm,MUSC_RO[e.pm],e.eq].concat(Object.keys(e.mm).map(k=>MUSC_RO[k]||k)).join(' ')); return t.every(w=>hay.indexOf(w)>=0); });
  return L;
}

      :`<button class="list-row link hl" data-a="dayOpen" data-k="${w.date}"><span class="ic-s lift">${ic('dumbbell')}</span><span class="sp"><b>${esc(w.t)}</b><span class="xs mu" style="display:block">${fmtDay(w.date)} · ${w.sets} serii · ${esc(w.ex.slice(0,3).join(', '))}</span></span>${ic('right')}</button>`}))
      .concat(g.r.map(r=>({d:r.date,h:`<button class="list-row link hl" data-a="runOpen" data-i="${r.i}"><span class="ic-s run">${ic('run')}</span><span class="sp"><b>${esc(RUNK[r.kind]||'Alergare')} · ${num(r.km,2)} km</b><span class="xs mu" style="display:block">${fmtDay(r.date)} · ${fmtClock((+r.min||0)*60)} · ${fmtPace(paceOf(r))}</span></span>${ic('right')}</button>`})))
      .sort((a,b)=>a.d<b.d?1:-1);
    const y=+k.slice(0,4), mo=+k.slice(5,7), ag=periodAgg(k+'-01',dayShift(mo===12?(y+1)+'-01-01':y+'-'+pad(mo+1)+'-01',-1));

/* scorul unei potriviri: toate cuvintele căutate trebuie să apară; titlul contează mai mult */
function palScore(q,t,k){ const a=fold(t), b=fold(k||''), w=q.split(/\s+/).filter(Boolean); let s=0;
  for(const x of w){ const i=a.indexOf(x); if(i===0) s+=6; else if(i>0) s+=a[i-1]===' '?4:2; else if(b.indexOf(x)>=0) s+=1; else return 0; } return s; }
function palSearch(raw){
  const q=fold(raw.trim()), out=[];
  if(!q){ return palCmds().filter(c=>c.g==='Comenzi').slice(0,9); }
  const ans=palAnswer(raw); if(ans) out.push(ans);
  palCmds().forEach(c=>{ const s=palScore(q,c.t,c.k); if(s) out.push(Object.assign({sc:s+(c.g==='Comenzi'?2:0)},c)); });
  exSearch(raw,{}).slice(0,6).forEach(e=>out.push({g:'Exerciții',t:e.n,s:[e.ro,e.g].filter(Boolean).join(' · '),icn:'dumbbell',sc:3,f:()=>ACT.exOpen(null,{k:e.n})}));
  const B=prBook(); Object.values(B.cur).forEach(p=>{ const n=prName(p), s=palScore(q,n,'record pr '+(PR_CAT[p.cat]||'')); if(s) out.push({g:'Recorduri',t:n,s:prVal(p)+(p.d?' · '+fmtDay(p.d):''),icn:'trophy',sc:s,f:()=>{ S.tab='prog'; S.progTab='pr'; render(); }}); });
  goalsAll().forEach(g=>{ const s=palScore(q,goalTitle(g),'obiectiv tinta'); if(s) out.push({g:'Obiective',t:goalTitle(g),s:'acum '+goalFmt(g,goalState(g).cur),icn:'target',sc:s,f:()=>ACT.goalOpen(null,{k:g.id})}); });
  (S.runs||[]).forEach((r,i)=>{ const t=num(r.km,2)+' km · '+(RUNK[r.kind]||'alergare')+' · '+fmtDayY(r.date), s=palScore(q,t,'alergare run '+(r.name||'')+' '+r.date); if(s) out.push({g:'Alergări',t,s:fmtClock((+r.min||0)*60)+' · '+fmtPace(paceOf(r)),icn:'run',sc:s,f:()=>ACT.runOpen(null,{I:i})}); });
  (S.hist||[]).forEach((h,i)=>{ const t=(h.t||'Antrenament')+' · '+fmtDayY(h.date), s=palScore(q,t,'antrenament sesiune '+h.date); if(s) out.push({g:'Antrenamente',t,s:Math.round((+h.dur||0)/60)+' min · '+(h.sets||0)+' serii',icn:'dumbbell',sc:s,f:()=>{ SH={kind:'hist',i}; shRender(); }}); });
  if(S.aiKey) out.push({g:'Antrenor AI',t:'Întreabă antrenorul: „'+raw.trim().slice(0,80)+'"',s:'răspunde din datele tale, cu Claude',icn:'coach',sc:.5,f:()=>aiSend(raw.trim())});
  const ord=['Răspuns','Comenzi','Navigare','Exerciții','Recorduri','Obiective','Alergări','Antrenamente','Unelte','Antrenor AI'];
  const grouped={}; out.sort((a,b)=>(b.sc||0)-(a.sc||0)).forEach(x=>{ (grouped[x.g]=grouped[x.g]||[]).push(x); });
  return ord.flatMap(g=>(grouped[g]||[]).slice(0,g==='Comenzi'||g==='Navigare'?6:5));
}

  if(/volum|tonaj/.test(q)){ const m=mondayOf(tk), w=ixSum(m,tk), l7=ixSum(dayShift(tk,-6),tk), p7=ixSum(dayShift(tk,-13),dayShift(tk,-7)), mo=ixSum(dayShift(tk,-29),tk);

function ioParse(txt){
  const rows=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim()); if(rows.length<2) return null;

  const split=l=>{ const out=[]; let cur='', q=false; for(const ch of l){ if(ch==='"') q=!q; else if(ch===sep&&!q){ out.push(cur); cur=''; } else cur+=ch; } out.push(cur); return out.map(x=>x.trim()); };
  const H=split(rows[0]).map(h=>fold(h)), col=re=>H.findIndex(h=>re.test(h));
  const ci={d:col(/^(date|data|zi|day)|start/),km:col(/(distan|^km|kilometri)/),t:col(/(timp|time|durat|moving|elapsed)/),hr:col(/(puls|heart|hr)/),w:col(/(greutate|weight|^kg$|masa)/)};
  const nv=v=>{ const x=parseFloat(String(v||'').replace(',','.')); return isFinite(x)?x:null; };
  const dt=v=>{ v=String(v||''); let m; if((m=/^(\d{1,2})[./](\d{1,2})[./](\d{4})/.exec(v))) return m[3]+'-'+pad(m[2])+'-'+pad(m[1]); return v.slice(0,10); };
  const body=rows.slice(1).map(split);
  if(ci.d>=0&&ci.km>=0&&ci.t>=0){ const out=[]; body.forEach(c=>{ const d=dt(c[ci.d]); let km=nv(c[ci.km]); const tv=c[ci.t]; let min=String(tv).indexOf(':')>=0?(parseTime(tv)||0)/60:nv(tv);
      if(km>200&&km<200000) km=km/1000; if(min>600) min=min/60; if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!(km>0&&km<300)||!(min>0)) return;
      const r={date:d,kind:'ez',km:Math.round(km*100)/100,min:Math.round(min*10)/10,src:'csv'}; const h=ci.hr>=0?nv(c[ci.hr]):null; if(h>=60&&h<=220) r.hr=Math.round(h); out.push(r); });
    return {type:'runs',rows:out}; }
  if(ci.d>=0&&ci.w>=0){ const out=[]; body.forEach(c=>{ const d=dt(c[ci.d]), w=nv(c[ci.w]); if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&w>30&&w<400) out.push({d,w:Math.round(w*10)/10}); }); return {type:'weights',rows:out}; }

const INTRO={on:false,leaving:false,done:null,mode:'full'};
/* praf fin în lumina de studio: puncte care plutesc încet în sus și sclipesc (mai vii pe mijloc), apoi se sting la ieșire */
function introParticles(mode){
  const cv=$('#introCv'); if(!cv||!cv.getContext) return;
  const ctx=cv.getContext('2d'), dpr=Math.min(2,devicePixelRatio||1), W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr;
  const cols=['#ffffff','#ffffff',TH().ac], N=mode==='full'?90:50;
  const ps=Array.from({length:N},(_,i)=>({x:Math.random()*W,y:Math.random()*H,r:(.4+Math.random()*1.3)*dpr,vx:(Math.random()-.5)*14*dpr,vy:-(6+Math.random()*24)*dpr,
    a:.25+Math.random()*.6,tw:Math.random()*6.283,c:cols[i%3],d:Math.random()*.8}));
  const t0=performance.now(); let last=t0;
  const frame=now=>{ if(!INTRO.on) return; const t=(now-t0)/1000, dt=Math.min(.05,(now-last)/1000); last=now;
    const out=INTRO.leaving?clamp(1-(now-INTRO.leftAt)/350,0,1):1;
    ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation='lighter';
    ps.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.tw+=dt*2.2; if(p.y<-10){ p.y=H+10; p.x=Math.random()*W; }
      const cone=1-Math.min(1,Math.abs(p.x/W-.5)*1.6), al=p.a*clamp((t-p.d)/1.2,0,1)*out*(.55+.45*Math.sin(p.tw))*(.35+.65*cone);
      if(al<.01) return; ctx.globalAlpha=al; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill(); });
    requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
}

    intro.querySelectorAll('.in-word,.in-bar,.in-sub,.in-skip,.in-ring').forEach(el=>el.animate([{opacity:1},{opacity:0,transform:'translateY(14px)'}],{duration:240,fill:'forwards'}));
    const ph=intro.querySelector('.in-ph'); if(ph) ph.animate([{transform:'scale(1.03)'},{transform:'scale(1.12)'}],{duration:700,easing:'cubic-bezier(.6,0,.2,1)',fill:'forwards'});
    const a=intro.animate([{clipPath:`circle(${Math.hypot(innerWidth,innerHeight)}px at ${cx}px ${cy}px)`},{clipPath:`circle(${r2.width/2}px at ${cx}px ${cy}px)`}],
      {duration:640,delay:60,easing:'cubic-bezier(.7,0,.25,1)',fill:'forwards'});
    a.onfinish=finish; setTimeout(()=>{ if(intro.isConnected) finish(); },1100);
  }catch(e){ finish(); }
}
(async function init(){
  introStart();
  /* online (https) merge și fără internet; local (file://) nu e nevoie */
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
  await loadAll(); applyTheme(); applyFx();
  /* stocare permanentă: browserul nu mai șterge datele unui site nefolosit (ex. Safari după 7 zile) */
  try{ if(navigator.storage&&navigator.storage.persist){ navigator.storage.persisted().then(p=>p||navigator.storage.persist()).then(p=>{
    if(navigator.storage.estimate) navigator.storage.estimate().then(e=>{ STEST=(e.usage?num(e.usage/1048576,1)+' MB folosiți':'')+(p?' · stocare permanentă':''); }); }).catch(()=>{}); } }catch(e){}
  await stCallback(location.search);
  try{ const d=new Date(), h=d.getHours(); $('#inSub').textContent=(h<5?'Noapte bună':h<12?'Bună dimineața':h<18?'Bună ziua':'Bună seara')+' · '+d.toLocaleDateString('ro-RO',{weekday:'long'}); }catch(e){}
  render();
  phLoad().then(()=>{ if(S.tab==='prog') render(); });
  if(S.sess) keepAlive(true);
  await INTRO.done;
  stAuto(); syAuto();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ stAuto(); syAuto(); } else if(syOn()&&syCfg().dirty&&!SY.busy){ clearTimeout(SY.timer); syncNow(false); } });
  addEventListener('online',()=>{ if(syOn()&&syCfg().dirty) syncNow(false); });
  if(!S.onb) setTimeout(onbOpen,200);
  else if(MQ_RM.matches&&S.motion==='auto'&&!S.motionAsked) setTimeout(()=>{ if(!SH&&!OB){ SH={kind:'motion'}; shRender(); } },600);
})();

</script>
